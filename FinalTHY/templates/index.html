<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux 实验故障智能诊断系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 16px;
               box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 40px; }
  h1 { color: #333; font-size: 26px; text-align: center; margin-bottom: 8px; }
  .subtitle { color: #888; text-align: center; margin-bottom: 30px; font-size: 14px; }
  label { display: block; font-weight: bold; color: #555; margin-bottom: 8px; }
  textarea { width: 100%; height: 160px; padding: 14px; border: 2px solid #eee; border-radius: 10px;
             font-family: Consolas, monospace; font-size: 13px; resize: vertical; transition: border-color .2s; }
  textarea:focus { outline: none; border-color: #667eea; }
  button { display: block; width: 100%; margin-top: 16px; padding: 14px;
           background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
           border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
           transition: transform .15s, box-shadow .2s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,.4); }
  .result { margin-top: 28px; padding: 22px; background: #f8f9ff; border-left: 5px solid #667eea;
            border-radius: 10px; }
  .result h2 { font-size: 18px; color: #333; margin-bottom: 14px; }
  .result-section { margin-bottom: 16px; }
  .result-section .tag { display: inline-block; background: #667eea; color: #fff; font-size: 12px;
                         padding: 3px 10px; border-radius: 4px; margin-right: 8px; }
  .result-section .tag.warn { background: #e74c3c; }
  .result-section pre { margin-top: 8px; background: #2d3436; color: #00e676; padding: 14px;
                       border-radius: 8px; font-family: Consolas, monospace;
                       font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .footer { text-align: center; margin-top: 24px; color: #aaa; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>🔧 Linux 实验故障智能诊断系统</h1>
  <p class="subtitle">AI Powered · 粘贴报错日志 · 秒级定位根因 · 一键获取修复命令</p>
  <form method="post" action="/index">
    {% csrf_token %}
    <label>📋 请粘贴你的报错信息：</label>
    <textarea name="error_log" placeholder="例如：bash: pip: command not found" required>{{ error_log }}</textarea>
    <button type="submit">🤖 AI 智能诊断</button>
  </form>
  {% if result %}
  <div class="result">
    <h2>✨ AI 诊断结果</h2>
    <div class="result-section">
      <span class="tag warn">根因定位</span>
      <p>{{ result.cause }}</p>
    </div>
    <div class="result-section">
      <span class="tag">修复命令</span>
      <pre>{{ result.fix }}</pre>
    </div>
  </div>
  {% endif %}
  <p class="footer">© FinalTHY · 网络操作系统期末考试 · 田昊阳 · 240200600</p>
</div>
</body>
</html>
